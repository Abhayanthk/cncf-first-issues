version: "3.8"

services:
  updater:
    build: .
    container_name: cncf-first-issues-updater
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # You can optionally create a .env file locally with GH_TOKEN=your_token
      - GH_TOKEN=${GH_TOKEN:-}
    volumes:
      # Map the local directory to the container so that it writes 
      # the README.md and orgs.json back to your host machine
      - .:/app
