name: Update Good First Issues

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

permissions:
  contents: write # Required to push commits back to the repo

# Prevent concurrent runs which cause git push race conditions
concurrency:
  group: "update-good-first-issues"
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CNCF Scraper
        env:
          # Use the built-in token for search API limits
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/update_readme.py

      - name: Commit and Push Changes
        run: |
          # Write commits as the repository owner
          git config --global user.name "Abhayanthk"
          git config --global user.email "Abhayanthk@users.noreply.github.com"
          
          # Add the generated files and caches
          git add README.md dead_orgs.json
          
          # Only commit and push if there are actual changes
          if git diff --staged --quiet; then
            echo "No new issues or cache updates to commit. Skipping push."
          else
            git commit -m "chore: auto-update README and caches [skip ci]"
            git push
          fi
